name: Android build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Show build environment
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS $RUNNER_ARCH"
          java -version
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload debug APK
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v6
        with:
          name: github-runner-test-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
